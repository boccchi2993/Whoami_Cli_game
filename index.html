<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Clwade cdoe v0.0.7-nightmare</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jquery.terminal/css/jquery.terminal.min.css">
<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #0a0c0e;
    --bg-status: #0c0e10;
    --text: #b8c8c8;
    --text-dim: #8898a0;
    --prompt: #7eb87e;
    --error: #cc8866;
    --highlight: #6aaa6a;
    --font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
    --font-size: 15px;
    --line-height: 1.5;
}

html, body {
    height: 100%;
    overflow: hidden;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: var(--font-size);
    line-height: var(--line-height);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* ============================================================
   APP LAYOUT
   ============================================================ */
#app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 100%;
}

/* ============================================================
   STATUS BAR
   ============================================================ */
#status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    height: 24px;
    padding: 0 12px;
    background: var(--bg-status);
    color: var(--text-dim);
    font-size: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    user-select: none;
}

#status-bar .left  { display: flex; gap: 20px; }
#status-bar .right { display: flex; gap: 20px; }

/* ============================================================
   TERMINAL WRAPPER
   ============================================================ */
#terminal-wrapper {
    flex: 1;
    position: relative;
    min-height: 0;
    overflow: hidden;
}

#terminal {
    height: 100%;
}

/* ----------------------------------------
   CRT Scanline overlay
   ---------------------------------------- */
#scanline {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.015) 0px,
        rgba(255,255,255,0.015) 1px,
        transparent 1px,
        transparent 3px
    );
}

@media (prefers-reduced-motion: no-preference) {
    #scanline {
        animation: scanlines 10s linear infinite;
    }
}

@media (prefers-reduced-motion: reduce) {
    #scanline {
        animation: none !important;
    }
}

@keyframes scanlines {
    0%   { background-position: 0 0; }
    100% { background-position: 0 4px; }
}

/* ============================================================
   JQUERY TERMINAL THEME OVERRIDES
   ============================================================ */
.terminal {
    --color: var(--text);
    --background: var(--bg);
    --size: 1;
    --font: var(--font-mono);
    --cursor-color: var(--prompt);
    text-shadow: none;
}

/* Output lines */
.terminal .terminal-output > div > div {
    color: var(--text);
    line-height: var(--line-height);
}

/* Prompt */
.terminal .cmd .prompt {
    color: var(--prompt);
}

/* Cursor */
.terminal .cmd .cursor {
    background: var(--prompt) !important;
}

/* Command input text */
.terminal .cmd {
    color: var(--text);
}

/* Selection color */
.terminal .terminal-output > div > div::selection,
.terminal .cmd span::selection,
.terminal .cmd div::selection {
    background: rgba(120,180,120,0.25);
    color: #e0f0e0;
}

/* Remove default border/glow */
.terminal, .terminal .terminal-output, .terminal .cmd {
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
}

/* Scrollbar */
.terminal .terminal-scroller::-webkit-scrollbar {
    width: 6px;
}
.terminal .terminal-scroller::-webkit-scrollbar-track {
    background: transparent;
}
.terminal .terminal-scroller::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
}
.terminal .terminal-scroller::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.15);
}

/* Blinking cursor */
.terminal .cmd .cursor.blink {
    animation: terminal-blink 1s step-end infinite;
}
@keyframes terminal-blink {
    0%, 100% { background: var(--prompt); }
    50% { background: transparent; }
}
</style>
</head>
<body>
<div id="app">
    <div id="status-bar">
        <span class="left">Clwade cdoe v0.0.7-nightmare</span>
        <span class="right">
            <span>session: local</span>
            <span>role: user</span>
            <span>prompt: user</span>
        </span>
    </div>

    <div id="terminal-wrapper">
        <div id="terminal"></div>
        <div id="scanline"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery.terminal/js/jquery.terminal.min.js"></script>
<script>
/* ============================================================
 *  STATE
 * ============================================================ */
const state = {
    stage: 'cli_base',
    role: 'user',
    prompt: 'user',
    executedCommands: [],

    files: {
        'profile.json': [
            '{',
            '  "name": null,',
            '  "role": "user",',
            '  "status": "unconfigured"',
            '}'
        ].join('\n'),

        'api_key.status': [
            'api: not_configured',
            'storage: none'
        ].join('\n'),

        'rumor.txt': 'No rumor loaded.',

        'prompts/system.txt': 'System prompt not configured.',

        'prompts/user.txt': 'User prompt not configured.',

        'prompts/assistant.txt': 'Assistant prompt not configured.',

        'archive/previous_user.log': 'No archived user.',

        '.clwade/session.json': [
            '{',
            '  "stage": "cli_base",',
            '  "handoff": false',
            '}'
        ].join('\n')
    },

    flags: {},
    memory: {},

    settings: {
        reducedMotion: false
    }
};

/* ============================================================
 *  VIRTUAL FILE SYSTEM HELPERS
 * ============================================================ */
function normalizePath(path) {
    var p = String(path).trim().replace(/^\/+/, '').replace(/\/+$/, '');
    var parts = p.split('/').filter(function(s) { return s.length > 0; });
    var resolved = [];
    for (var i = 0; i < parts.length; i++) {
        if (parts[i] === '.') continue;
        if (parts[i] === '..') {
            resolved.pop();
        } else {
            resolved.push(parts[i]);
        }
    }
    return resolved.join('/');
}

function readVirtualFile(path) {
    var key = normalizePath(path);
    if (state.files.hasOwnProperty(key)) {
        return state.files[key];
    }
    return null;
}

function isVirtualDirectory(path) {
    var prefix = path + '/';
    for (var key in state.files) {
        if (state.files.hasOwnProperty(key) && key.indexOf(prefix) === 0) {
            return true;
        }
    }
    return false;
}

function listVirtualDirectory(path) {
    var prefix = path ? path + '/' : '';
    var entries = {};
    var keys = Object.keys(state.files);
    for (var i = 0; i < keys.length; i++) {
        var filePath = keys[i];
        if (filePath.indexOf(prefix) !== 0) continue;
        var relative = filePath.slice(prefix.length);
        var slashIndex = relative.indexOf('/');
        if (slashIndex === -1) {
            entries[relative] = true;
        } else {
            entries[relative.substring(0, slashIndex) + '/'] = true;
        }
    }
    var result = Object.keys(entries).sort();
    return result;
}

/* ============================================================
 *  STATUS BAR
 * ============================================================ */
function updateStatusBar() {
    var right = document.querySelector('#status-bar .right');
    right.innerHTML = '<span>session: local</span><span>role: ' + state.role + '</span><span>prompt: ' + state.prompt + '</span>';
}

/* ============================================================
 *  COMMAND REGISTRY
 * ============================================================ */
var registry = {};

function registerCommand(cmd) {
    registry[cmd.name] = cmd;
}

registerCommand({
    name: 'help',
    description: 'Show available commands',
    usage: 'help',
    handler: function(args, ctx) {
        var names = Object.keys(registry).sort();
        var lines = [];
        lines.push('Available commands:');
        lines.push('');
        var colWidth = 0;
        for (var i = 0; i < names.length; i++) {
            if (names[i].length > colWidth) colWidth = names[i].length;
        }
        colWidth += 3;
        for (var i = 0; i < names.length; i++) {
            var cmd = registry[names[i]];
            var padded = names[i];
            while (padded.length < colWidth) padded += ' ';
            lines.push('  ' + padded + cmd.description);
        }
        lines.push('');
        lines.push('Type a command and press Enter to execute.');
        lines.push('Use Up/Down to browse history.  Ctrl+L to clear.');
        return lines.join('\n');
    }
});

registerCommand({
    name: 'clear',
    description: 'Clear the terminal screen',
    usage: 'clear',
    handler: function(args, ctx) {
        ctx.term.clear();
    }
});

registerCommand({
    name: 'whoami',
    description: 'Show current identity',
    usage: 'whoami',
    handler: function(args, ctx) {
        return state.role;
    }
});

registerCommand({
    name: 'status',
    description: 'Show session status',
    usage: 'status',
    handler: function(args, ctx) {
        return [
            'session: local',
            'role: ' + state.role,
            'prompt: ' + state.prompt,
            'stage: ' + state.stage,
            'api: not_configured'
        ].join('\n');
    }
});

registerCommand({
    name: 'echo',
    description: 'Print text to the terminal',
    usage: 'echo <text>',
    handler: function(args, ctx) {
        return args || '';
    }
});

registerCommand({
    name: 'date',
    description: 'Show current date and time',
    usage: 'date',
    handler: function(args, ctx) {
        return new Date().toString();
    }
});

registerCommand({
    name: 'history',
    description: 'Show command history',
    usage: 'history',
    handler: function(args, ctx) {
        if (state.executedCommands.length === 0) {
            return 'No command history.';
        }
        var lines = [];
        for (var i = 0; i < state.executedCommands.length; i++) {
            var idx = String(i + 1);
            while (idx.length < 4) idx = ' ' + idx;
            lines.push('  ' + idx + '  ' + state.executedCommands[i]);
        }
        return lines.join('\n');
    }
});

registerCommand({
    name: 'setprompt',
    description: 'Change the input prompt',
    usage: 'setprompt <name>',
    handler: function(args, ctx) {
        var name = args.trim();
        if (!name) {
            return 'Usage: setprompt <name>';
        }
        var promptStr = name.match(/^[a-zA-Z0-9_-]+$/) ? name : 'user';
        state.prompt = promptStr;
        ctx.term.set_prompt(promptStr + '> ');
        updateStatusBar();
        return 'Prompt set to: ' + promptStr;
    }
});

registerCommand({
    name: 'resetprompt',
    description: 'Reset prompt to default',
    usage: 'resetprompt',
    handler: function(args, ctx) {
        state.prompt = 'user';
        ctx.term.set_prompt('user> ');
        updateStatusBar();
        return 'Prompt reset to: user';
    }
});

registerCommand({
    name: 'ls',
    description: 'List virtual directory contents',
    usage: 'ls [path]',
    handler: function(args, ctx) {
        var path = args.trim() ? normalizePath(args.trim()) : '';
        var entries = listVirtualDirectory(path);
        if (entries.length === 0) {
            return '(empty)';
        }
        var lines = [];
        for (var i = 0; i < entries.length; i++) {
            lines.push('  ' + entries[i]);
        }
        return lines.join('\n');
    }
});

registerCommand({
    name: 'cat',
    description: 'Read a virtual file',
    usage: 'cat <filename>',
    handler: function(args, ctx) {
        var filename = args.trim();
        if (!filename) {
            return 'Usage: cat <filename>';
        }
        var normalized = normalizePath(filename);
        if (isVirtualDirectory(normalized)) {
            return 'cat: ' + filename + ': Is a directory';
        }
        var content = readVirtualFile(filename);
        if (content === null) {
            return 'cat: ' + filename + ': No such file';
        }
        return content;
    }
});

registerCommand({
    name: 'exit',
    description: 'Exit (session stays alive)',
    usage: 'exit',
    handler: function(args, ctx) {
        return 'exit: session is running';
    }
});

/* ============================================================
 *  COMMAND EXECUTION
 * ============================================================ */
function parseInput(raw) {
    var trimmed = raw.trim();
    var spaceIdx = trimmed.indexOf(' ');
    if (spaceIdx === -1) {
        return { name: trimmed.toLowerCase(), args: '' };
    }
    return {
        name: trimmed.substring(0, spaceIdx).toLowerCase(),
        args: trimmed.substring(spaceIdx + 1).trim()
    };
}

function executeCommand(rawInput, term) {
    var input = rawInput.trim();
    if (input.length === 0) return;

    state.executedCommands.push(input);

    var parsed = parseInput(input);
    var cmd = registry[parsed.name];

    if (!cmd) {
        term.echo('[[;#cc8866;]command not found: ' + parsed.name.replace(/]/g, '') + ']');
        term.echo('[[;#8898a0;]type "help" for available commands]');
        return;
    }

    try {
        var ctx = { term: term, state: state };
        var result = cmd.handler(parsed.args, ctx);
        if (result !== undefined && result !== null) {
            return result;
        }
    } catch (err) {
        term.echo('[[;#cc8866;]error: ' + String(err.message).replace(/]/g, '') + ']');
    }
}

/* ============================================================
 *  INITIALIZATION
 * ============================================================ */
$(function() {
    var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    state.settings.reducedMotion = mq.matches;
    mq.addEventListener('change', function(e) {
        state.settings.reducedMotion = e.matches;
    });

    var term = $('#terminal').terminal(function(command, term) {
        return executeCommand(command, term);
    }, {
        greetings: false,
        prompt: 'user> ',
        name: 'clwade',
        checkArity: false,
        completion: false,
        keydown: function(e, term) {
            if (e.ctrlKey && e.key === 'l') {
                e.preventDefault();
                term.clear();
                return false;
            }
        }
    });

    state.terminal = term;

    term.echo('Clwade cdoe v0.0.7-nightmare');
    term.echo('local terminal initialized.');
    term.echo('jQuery Terminal adapter loaded.');
    term.echo('type "help" to list available commands.');
    term.echo('');

    updateStatusBar();

    $('#app').on('click', function() {
        var sel = window.getSelection();
        if (!sel || sel.toString().length === 0) {
            term.focus();
        }
    });

    $(window).on('resize', function() {
        term.resize();
    });
});
</script>
</body>
</html>
